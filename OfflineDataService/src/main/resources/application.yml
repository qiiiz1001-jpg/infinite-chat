spring:
  application:
    name: OfflineDataService
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:Qingliao}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useAffectedRows=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2
      timeout: 5s
      ttl: 86400
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
        metadata:
          ws-port: ${NETTY_PORT:9101}
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 10000
          AiService:
            connectTimeout: 3000
            readTimeout: 180000
server:
  port: 8101
canal:
  enabled: ${CANAL_ENABLED:false}
  server:
    host: ${CANAL_HOST:localhost}
    port: 11111
  destination: example
  username: ${CANAL_USERNAME:}
  password: ${CANAL_PASSWORD:}
  filter: Qingliao\.message
chat:
  internal-token: ${INTERNAL_TOKEN:local-internal-change-me}
services:
  userservice:
    url: ${USER_SERVICE_URL:http://localhost:8104}
  aiservice:
    url: ${AI_SERVICE_URL:http://localhost:8105}
  offlinedataservice:
    url: ${OFFLINE_SERVICE_URL:http://localhost:8101}
snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:-1}
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
