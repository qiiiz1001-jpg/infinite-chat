  offlinedataservice:
    environment:
      NACOS_ENABLED: 'true'
      USER_SERVICE_URL: ''
      AI_SERVICE_URL: ''
      OFFLINE_SERVICE_URL: ''
  redpacketservice:
    environment:
      NACOS_ENABLED: 'true'
      USER_SERVICE_URL: ''
      AI_SERVICE_URL: ''
      OFFLINE_SERVICE_URL: ''
  aiservice:
    environment:
      NACOS_ENABLED: 'true'
      USER_SERVICE_URL: ''
      AI_SERVICE_URL: ''
      OFFLINE_SERVICE_URL: ''
