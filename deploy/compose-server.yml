name: infinitechat-learn
services:
  mysql:
    image: mysql:8.0.41
    command:
    - --server-id=1
    - --log-bin=mysql-bin
    - --binlog-format=ROW
    - --binlog-row-image=FULL
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?prepare .env first}
      MYSQL_DATABASE: ${DB_NAME:-Qingliao}
      TZ: Asia/Shanghai
    ports:
    - 127.0.0.1:${DB_PORT:-3307}:3306
    volumes:
    - mysql-data:/var/lib/mysql
    - ./generated/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.2.7
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --requirepass
    - ${REDIS_PASSWORD:?prepare .env first}
    ports:
    - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
    - zookeeper
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
    volumes:
    - kafka-data:/var/lib/kafka/data
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:-chat_vectors}
      POSTGRES_USER: ${PGVECTOR_USER:-chat}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?prepare .env first}
    ports:
    - 127.0.0.1:${PGVECTOR_PORT:-5432}:5432
    volumes:
    - pgvector-data:/var/lib/postgresql/data
    - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    - ../database/postgres/03-scoped-knowledge.sql:/docker-entrypoint-initdb.d/03-scoped-knowledge.sql:ro
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?prepare .env first}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://localhost:10010
    ports:
    - 9000:9000
    - 127.0.0.1:9001:9001
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 30
  nacos:
    image: nacos/nacos-server:v3.0.3
    profiles:
    - discovery
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: 'false'
      JVM_XMS: 256m
      JVM_XMX: 512m
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: '3306'
      MYSQL_SERVICE_DB_NAME: ${NACOS_DB_NAME:-nacos_config}
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: ${MYSQL_NACOS_PASSWORD:?run prepare-env first}
      MYSQL_SERVICE_DB_PARAM: allowPublicKeyRetrieval=true&characterEncoding=UTF8&serverTimezone=Asia/Shanghai&connectTimeout=10000&socketTimeout=30000&useSSL=false
    ports:
    - 127.0.0.1:8848:8848
    - 127.0.0.1:9848:9848
    - 127.0.0.1:18848:8080
    depends_on:
      mysql:
        condition: service_healthy
  canal:
    image: canal/canal-server:v1.1.7
    profiles:
    - cdc
    depends_on:
      mysql:
        condition: service_healthy
    ports:
    - 127.0.0.1:11111:11111
    volumes:
    - ./generated/canal-instance.properties:/home/admin/canal-server/conf/example/instance.properties:ro
    environment:
      canal.destinations: example
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles:
    - monitoring
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:11.6.0
    profiles:
    - monitoring
    ports:
    - 127.0.0.1:3000:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?prepare .env first}
    volumes:
    - grafana-data:/var/lib/grafana
    - ./grafana:/etc/grafana/provisioning:ro
  userservice:
    build:
      context: ..
      dockerfile: UserService/Dockerfile
    profiles:
    - apps
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-Qingliao}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      NACOS_ENABLED: ${NACOS_ENABLED:-false}
      NACOS_SERVER_ADDR: nacos:8848
      USER_SERVICE_URL: http://userservice:8104
      AI_SERVICE_URL: http://aiservice:8105
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      NETTY_URI: ws://${NETTY_ADVERTISED_HOST:-localhost}:9101/ws/netty
      NETTY_ADVERTISED_HOST: ${NETTY_ADVERTISED_HOST:-localhost}
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai -XX:MaxRAMPercentage=70.0
      USER_SERVICE_URI: http://userservice:8104
      OFFLINE_SERVICE_URI: http://offlinedataservice:8101
      AI_SERVICE_URI: http://aiservice:8105
      REDPACKET_SERVICE_URI: http://redpacketservice:8103
      CHAT_NODE_ID: userservice-1
      SNOWFLAKE_WORKER_ID: '1'
      MINIO_INITIALIZE: 'true'
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
  aiservice:
    build:
      context: ..
      dockerfile: AiService/Dockerfile
    profiles:
    - ai
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-Qingliao}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      NACOS_ENABLED: ${NACOS_ENABLED:-false}
      NACOS_SERVER_ADDR: nacos:8848
      USER_SERVICE_URL: http://userservice:8104
      AI_SERVICE_URL: http://aiservice:8105
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      NETTY_URI: ws://${NETTY_ADVERTISED_HOST:-localhost}:9101/ws/netty
      NETTY_ADVERTISED_HOST: ${NETTY_ADVERTISED_HOST:-localhost}
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai -XX:MaxRAMPercentage=70.0
      USER_SERVICE_URI: http://userservice:8104
      OFFLINE_SERVICE_URI: http://offlinedataservice:8101
      AI_SERVICE_URI: http://aiservice:8105
      REDPACKET_SERVICE_URI: http://redpacketservice:8103
      CHAT_NODE_ID: aiservice-1
      OFFLINE_SERVICE_URL: http://offlinedataservice:8101
      SNOWFLAKE_WORKER_ID: '5'
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      PGVECTOR_HOST: pgvector
      PGVECTOR_PORT: '5432'
      PGVECTOR_DATABASE: ${PGVECTOR_DATABASE:-chat_vectors}
      PGVECTOR_USER: ${PGVECTOR_USER:-chat}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD}
      RAG_DOCS_PATH: /app/docs
      RAG_LOAD_ON_STARTUP: ${RAG_LOAD_ON_STARTUP:-false}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
  offlinedataservice:
