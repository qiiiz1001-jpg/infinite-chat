      USER_SERVICE_URI: http://userservice:8104
      OFFLINE_SERVICE_URI: http://offlinedataservice:8101
      AI_SERVICE_URI: http://aiservice:8105
      REDPACKET_SERVICE_URI: http://redpacketservice:8103
