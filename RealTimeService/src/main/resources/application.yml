spring:
  application:
    name: RealTimeService
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:Qingliao}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useAffectedRows=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2
      timeout: 5s
      ttl: 86400
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
        metadata:
          ws-port: ${NETTY_PORT:9101}
          ws-host: ${NETTY_ADVERTISED_HOST:localhost}
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 10000
          AiService:
            connectTimeout: 3000
            readTimeout: 180000
server:
  port: 8102
netty:
  port: ${NETTY_PORT:9101}
  worker-threads: 4
  business-threads: 4
  reader-idle-seconds: 60
snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:2}
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
chat:
  node-id: ${CHAT_NODE_ID:node-1}
  internal-token: ${INTERNAL_TOKEN:local-internal-change-me}
services:
  userservice:
    url: ${USER_SERVICE_URL:http://localhost:8104}
  aiservice:
    url: ${AI_SERVICE_URL:http://localhost:8105}
  offlinedataservice:
    url: ${OFFLINE_SERVICE_URL:http://localhost:8101}

ai:
  enabled: ${AI_ENABLED:true}
